apiVersion: v1
kind: Secret
metadata:
  name: veriforgeops-secrets
  namespace: veriforgeops-dev
type: Opaque
stringData:
  # DO NOT apply this file directly with placeholder values.
  # All values are injected via CI/CD from GitHub Actions secrets.
  # CI/CD runs:
  #   kubectl create secret generic veriforgeops-secrets \
  #     --namespace=veriforgeops-dev \
  #     --from-literal=JWT_SECRET=<same as prod> \
  #     --from-literal=MONGO_URI=mongodb://mongodb-service.veriforgeops-dev.svc.cluster.local:27017/veriforgeops-dev \
  #     --from-literal=SEED_PASSWORD_ADMIN=<value> \
  #     --from-literal=SEED_PASSWORD_DEMO=<value> \
  #     --from-literal=SEED_PASSWORD_RIMNA=<value> \
  #     --from-literal=SEED_PASSWORD_IYER=<value> \
  #     --from-literal=SEED_PASSWORD_SENTHEESH=<value> \
  #     --from-literal=SEED_PASSWORD_HARPREET=<value> \
  #     --from-literal=SEED_PASSWORD_SUNIL=<value> \
  #     --from-literal=SEED_PASSWORD_MURUGESH=<value> \
  #     --from-literal=SEED_PASSWORD_JISHNU=<value> \
  #     --from-literal=SEED_PASSWORD_HEMANT=<value> \
  #     --from-literal=SEED_PASSWORD_SAMIR=<value> \
  #     --from-literal=SEED_PASSWORD_HUSSAIN=<value> \
  #     --from-literal=SEED_PASSWORD_ANNAL=<value> \
  #     --from-literal=SEED_PASSWORD_SATISH=<value> \
  #     --dry-run=client -o yaml | kubectl apply -f -
  JWT_SECRET: "CHANGE_ME_BEFORE_APPLY"
  MONGO_URI: "mongodb://mongodb-service.veriforgeops-dev.svc.cluster.local:27017/veriforgeops-dev"
