# ─────────────────────────────────────────────────────────────────
# nginx site config — VeriForge Ops
# Location: /etc/nginx/sites-available/veriforge-ops
# Enable: ln -s /etc/nginx/sites-available/veriforge-ops /etc/nginx/sites-enabled/
#
# Architecture:
#   Port 80  ─► nginx
#              ├── /api/*    ─► proxy → Express :4000  (API routes)
#              ├── /health   ─► proxy → Express :4000  (health check)
#              └── /*        ─► static files in /opt/veriforge-ops/build
# ─────────────────────────────────────────────────────────────────

upstream veriforge_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your EC2 public IP or _ to accept any hostname
    server_name <EC2-PUBLIC-IP> _;

    # ── Logging ──────────────────────────────────────────────────
    access_log /var/log/nginx/veriforge-ops.access.log;
    error_log  /var/log/nginx/veriforge-ops.error.log warn;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── API proxy ─────────────────────────────────────────────────
    # All /api/* requests go to Express (which also prefixes routes with /api)
    location /api/ {
        proxy_pass         http://veriforge_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    90s;
        proxy_connect_timeout 10s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Health check endpoint ─────────────────────────────────────
    location = /health {
        proxy_pass         http://veriforge_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── React SPA — static files ──────────────────────────────────
    root /opt/veriforge-ops/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (CRA adds content hash to filenames)
    location /static/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # Never cache the HTML entry point (so new deploys take effect immediately)
    location = /index.html {
        expires     -1;
        add_header  Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Upload limit ──────────────────────────────────────────────
    client_max_body_size 10m;
}
