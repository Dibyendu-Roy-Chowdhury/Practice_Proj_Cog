apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veriforgeops-ingress
  namespace: veriforgeops
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "veriforgeops-static-ip"
spec:
  rules:
  - host: veriforgeops.endpoints.cog01k24f1ea555zdv7ynzthxanz5.cloud.goog
    http:
      paths:
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 4000
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
