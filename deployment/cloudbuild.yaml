steps:
  # Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veriforgeops-frontend:latest'
      - '-f'
      - 'deployment/Dockerfile.frontend'
      - '.'
    id: 'build-frontend'

  # Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veriforgeops-backend:latest'
      - '-f'
      - 'deployment/Dockerfile.backend'
      - '.'
    id: 'build-backend'

images:
  - 'gcr.io/$PROJECT_ID/veriforgeops-frontend:latest'
  - 'gcr.io/$PROJECT_ID/veriforgeops-backend:latest'

timeout: '1200s'
