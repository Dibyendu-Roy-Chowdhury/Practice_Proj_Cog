apiVersion: v1
kind: Secret
metadata:
  name: veriforgeops-secrets
  namespace: veriforgeops
type: Opaque
stringData:
  # ⚠ JWT_SECRET MUST be replaced with a strong random value before applying.
  # NEVER commit the actual secret to git.
  #
  # Generate a secure value:
  #   openssl rand -hex 32
  #
  # Recommended: provision via kubectl directly (do not use this file):
  #   kubectl create secret generic veriforgeops-secrets \
  #     --namespace=veriforgeops \
  #     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
  #     --from-literal=MONGO_URI=mongodb://mongodb-service.veriforgeops.svc.cluster.local:27017/veriforgeops
  JWT_SECRET: "CHANGE_ME_BEFORE_APPLY"
  MONGO_URI: "mongodb://mongodb-service.veriforgeops.svc.cluster.local:27017/veriforgeops"
