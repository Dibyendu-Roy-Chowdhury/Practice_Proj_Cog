apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: veriforgeops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/veriforgeops-frontend:latest
        ports:
        - containerPort: 8080  # nginxinc/nginx-unprivileged listens on 8080 (non-root)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
